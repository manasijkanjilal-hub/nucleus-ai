# =============================================================================
# Nucleus AI — GitLab CI/CD Pipeline
# =============================================================================
stages:
  - lint
  - test
  - security
  - build
  - deploy

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend

# ---- Templates ---------------------------------------------------------------
.python_template: &python_template
  image: python:3.12-slim
  before_script:
    - cd backend
    - pip install --no-cache-dir -r requirements.txt

.node_template: &node_template
  image: node:20-alpine
  before_script:
    - cd frontend
    - npm ci

# ---- Lint Stage --------------------------------------------------------------
lint:backend:
  stage: lint
  <<: *python_template
  script:
    - pip install ruff
    - ruff check .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "staging"

lint:frontend:
  stage: lint
  <<: *node_template
  script:
    - npm run lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "staging"

# ---- Test Stage --------------------------------------------------------------
test:backend:
  stage: test
  <<: *python_template
  services:
    - name: postgres:16-alpine
      alias: postgres
      variables:
        POSTGRES_USER: nucleus
        POSTGRES_PASSWORD: testpassword
        POSTGRES_DB: nucleus_test
  variables:
    DATABASE_URL: postgresql+asyncpg://nucleus:testpassword@postgres:5432/nucleus_test
    DATABASE_URL_SYNC: postgresql+psycopg2://nucleus:testpassword@postgres:5432/nucleus_test
    OPENAI_API_KEY: test-key
  script:
    - pip install pytest pytest-asyncio pytest-cov httpx aiosqlite
    - python -m pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "staging"

test:frontend:build:
  stage: test
  <<: *node_template
  variables:
    NEXT_PUBLIC_API_URL: http://localhost:8000
    NEXT_PUBLIC_APP_URL: http://localhost:3000
    DATABASE_URL: postgresql://test:test@localhost:5432/test
    NEXTAUTH_SECRET: test-secret
  script:
    - npm run build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "staging"

# ---- Security Stage ----------------------------------------------------------
security:scan:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy fs --severity CRITICAL,HIGH --exit-code 0 backend/
    - trivy fs --severity CRITICAL,HIGH --exit-code 0 frontend/
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "staging"
  allow_failure: true

# ---- Build Stage -------------------------------------------------------------
build:backend:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -f docker/production/Dockerfile.backend
      -t $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA
      -t $BACKEND_IMAGE:latest .
    - docker push $BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $BACKEND_IMAGE:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "staging"

build:frontend:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -f docker/production/Dockerfile.frontend
      --build-arg NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL
      -t $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA
      -t $FRONTEND_IMAGE:latest .
    - docker push $FRONTEND_IMAGE:$CI_COMMIT_SHORT_SHA
    - docker push $FRONTEND_IMAGE:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "staging"

# ---- Deploy Stage ------------------------------------------------------------
deploy:staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$STAGING_SSH_KEY" | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$STAGING_SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
  script:
    - ssh $STAGING_USER@$STAGING_HOST "cd /opt/nucleus-ai &&
        git pull origin staging &&
        docker compose -f docker-compose.prod.yml --env-file .env.staging pull &&
        docker compose -f docker-compose.prod.yml --env-file .env.staging up -d &&
        sleep 10 &&
        curl -f http://localhost:8000/health"
  environment:
    name: staging
    url: https://staging.yourdomain.com
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"

deploy:production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$PRODUCTION_SSH_KEY" | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$PRODUCTION_SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
  script:
    - ssh $PRODUCTION_USER@$PRODUCTION_HOST "cd /opt/nucleus-ai &&
        git pull origin main &&
        docker compose -f docker-compose.prod.yml --env-file .env.production pull &&
        docker compose -f docker-compose.prod.yml --env-file .env.production up -d &&
        docker compose -f docker-compose.prod.yml exec -T backend alembic upgrade head &&
        sleep 15 &&
        curl -f http://localhost:8000/health"
  environment:
    name: production
    url: https://yourdomain.com
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  when: manual
