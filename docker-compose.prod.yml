# =============================================================================
# Nucleus AI — Production Docker Compose
# Usage:  docker compose -f docker-compose.prod.yml --env-file .env.production up -d
# =============================================================================
version: "3.9"

services:
  # ---- Nginx Reverse Proxy ---------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - nucleus-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ---- PostgreSQL ------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nucleus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nucleus}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "127.0.0.1:5432:5432"  # bind only to localhost
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/deployment/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nucleus} -d ${POSTGRES_DB:-nucleus}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nucleus-net
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          memory: 512M

  # ---- Qdrant (Vector DB) ----------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.12.5
    restart: always
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - nucleus-net
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G
        reservations:
          memory: 512M

  # ---- FastAPI Backend -------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: docker/production/Dockerfile.backend
    restart: always
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nucleus}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nucleus}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-nucleus}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nucleus}
      QDRANT_URL: http://qdrant:6333
      APP_ENV: production
      DEBUG: "false"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - nucleus-net
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          memory: 512M
      replicas: 2

  # ---- Next.js Frontend ------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: docker/production/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.yourdomain.com}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://yourdomain.com}
    restart: always
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://yourdomain.com}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - nucleus-net
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          memory: 256M

volumes:
  pgdata:
    driver: local
  qdrant_data:
    driver: local
  nginx_cache:
    driver: local

networks:
  nucleus-net:
    driver: bridge
