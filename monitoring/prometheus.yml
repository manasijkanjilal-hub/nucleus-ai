# =============================================================================
# Nucleus AI — Prometheus Configuration
# =============================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Alerting rules (optional)
rule_files: []

scrape_configs:
  - job_name: 'nucleus-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:8000']
        labels:
          service: 'backend'

  - job_name: 'qdrant'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['qdrant:6333']
        labels:
          service: 'qdrant'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
